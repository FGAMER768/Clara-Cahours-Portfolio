<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fond violet (accent-strong du site) aux coins arrondis -->
  <rect width="64" height="64" rx="14" fill="#6F5D96"/>
  <!-- Deux "C" en tracés vectoriels (aucune police à charger) : arcs de
       rayon 8.5, ouverts vers la droite, trait de 5.5. Lisibles jusqu'à 16 px. -->
  <g fill="none" stroke="#F7F4F1" stroke-linecap="round" stroke-width="5.5">
    <path d="M27.00 21.49A8.5 8.5 0 1 0 27.00 34.51"/>
    <path d="M50.96 21.49A8.5 8.5 0 1 0 50.96 34.51"/>
  </g>
  <!-- Touche ocre terracotta (secondaire du site) -->
  <rect x="17" y="45" width="30" height="4.5" rx="2.25" fill="#C98853"/>
</svg>
